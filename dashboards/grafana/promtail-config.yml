server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: payments_jsonl
    static_configs:
      - targets: [localhost]
        labels:
          job: payments_jsonl
          app: payments
          __path__: /logs/*.jsonl

    pipeline_stages:
      # 1) Parse JSON and extract only fields we care about.
      - json:
          expressions:
            ts: ts                           # RFC3339Nano timestamp
            # classification signals
            NumberOfTransactions: NumberOfTransactions
            InterbankSettlementAmount: InterbankSettlementAmount
            CreditDebitIndicator: CreditDebitIndicator
            # common dims (keep cardinality low!)
            ServiceLevelCode: ServiceLevelCode
            DebtorAgentBICFI: DebtorAgentBICFI
            CreditorAgentBICFI: CreditorAgentBICFI
            InterbankSettlementCurrency: InterbankSettlementCurrency
            Currency: Currency
            Status: Status

      # 2) Use the record timestamp as the log timestamp.
      - timestamp:
          source: ts
          format: RFC3339Nano

      # 3) Derive a stable, low-cardinality event_type.
      #    - PACS: has InterbankSettlementAmount
      #    - CAMT: has CreditDebitIndicator/Amount
      #    - PAIN: has NumberOfTransactions/ControlSum, no interbank fields
      - template:
          source: event_type
          template: |
            {{- if .InterbankSettlementAmount -}}
              pacs
            {{- else if .CreditDebitIndicator -}}
              camt
            {{- else if .NumberOfTransactions -}}
              pain
            {{- else -}}
              unknown
            {{- end -}}

      # 4) Normalise currency: prefer interbank currency, fallback to Currency.
      - template:
          source: currency_norm
          template: |
            {{- if .InterbankSettlementCurrency -}}{{.InterbankSettlementCurrency}}
            {{- else if .Currency -}}{{.Currency}}
            {{- else -}}UNKNOWN{{- end -}}

      # --- Country codes from IBAN (best) or fallback to BIC country ---
      - template:
          source: deb_cc
          template: '{{- if .DebtorAccountIdentificationIBAN -}}{{ regexReplaceAll "^(..).*" .DebtorAccountIdentificationIBAN "$1" }}{{- else if .DebtorAgentBICFI -}}{{ regexReplaceAll "^[A-Z]{4}([A-Z]{2}).*" .DebtorAgentBICFI "$1" }}{{- else -}}UN{{- end -}}'

      - template:
          source: cred_cc
          template: '{{- if .CreditorAccountIdentificationIBAN -}}{{ regexReplaceAll "^(..).*" .CreditorAccountIdentificationIBAN "$1" }}{{- else if .CreditorAgentBICFI -}}{{ regexReplaceAll "^[A-Z]{4}([A-Z]{2}).*" .CreditorAgentBICFI "$1" }}{{- else -}}UN{{- end -}}'

      - template:
          source: route
          template: '{{.deb_cc}}->{{.cred_cc}}'

      - labels:
          deb_cc:
          cred_cc:
          route:
      # 5) Promote a SAFE subset of fields to labels.
      - labels:
          app:
          job:
          event_type:
          ServiceLevelCode:
          DebtorAgentBICFI:
          CreditorAgentBICFI:
          currency_norm:
          Status:
          CreditDebitIndicator:

      # 6) Trim any accidental high-cardinality labels (defensive).
      - labeldrop:
          - __path__           # internal
          # do NOT add messageId/e2e/transaction ids here as labels

      # 7) Optional: drop pure ACK/BOOK camt credits/debits if you only want PACS flows
      #    (leave commented unless you explicitly want to filter)
      # - match:
      #     selector: '{job="payments_jsonl",event_type="camt"}'
      #     stages:
      #       - drop:
      #           expression: '^(?:BOOK)$'
      #           source: Status
