server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: payments_jsonl
    static_configs:
      - targets: [localhost]
        labels:
          job: payments_jsonl
          app: payments
          __path__: /logs/*.jsonl

    pipeline_stages:
      # 1) Parse JSON and extract all fields we care about.
      - json:
          expressions:
            ts: ts                                # RFC3339Nano timestamp

            # --- Monetary Values (for all types) ---
            InterbankSettlementAmount: InterbankSettlementAmount # (pacs)
            Amount: Amount                              # (camt)
            ControlSum: ControlSum                        # (pain)
            InstructedAmount: InstructedAmount              # (pain)

            # --- Classification & Common Dims ---
            NumberOfTransactions: NumberOfTransactions
            CreditDebitIndicator: CreditDebitIndicator
            ServiceLevelCode: ServiceLevelCode
            Status: Status

            # --- Currency Fields ---
            InterbankSettlementCurrency: InterbankSettlementCurrency
            Currency: Currency

            # --- Debtor/Creditor Agent Fields (for BICs) ---
            DebtorAgentBICFI: DebtorAgentBICFI
            CreditorAgentBICFI: CreditorAgentBICFI

            # --- Debtor/Creditor Account Fields (for IBANs / Country Codes) ---
            DebtorAccountIdentificationIBAN: DebtorAccountIdentificationIBAN
            CreditorAccountIdentificationIBAN: CreditorAccountIdentificationIBAN

      # 2) Use the record timestamp as the log timestamp.
      - timestamp:
          source: ts
          format: RFC3339Nano

      # 3) Derive a stable, low-cardinality event_type.
      - template:
          source: event_type
          template: |
            {{- if .InterbankSettlementAmount -}}
              pacs
            {{- else if .CreditDebitIndicator -}}
              camt
            {{- else if .NumberOfTransactions -}}
              pain
            {{- else -}}
              unknown
            {{- end -}}

      # 4) Normalise currency: prefer interbank currency, fallback to Currency.
      - template:
          source: currency_norm
          template: |
            {{- if .InterbankSettlementCurrency -}}{{.InterbankSettlementCurrency}}
            {{- else if .Currency -}}{{.Currency}}
            {{- else -}}UNKNOWN{{- end -}}

      # 5) --- Country codes from IBAN (best) or fallback to BIC country ---
      #    (This will now work correctly since IBAN fields are extracted)
      - template:
          source: deb_cc
          template: '{{- if .DebtorAccountIdentificationIBAN -}}{{ regexReplaceAll "^(..).*" .DebtorAccountIdentificationIBAN "$1" }}{{- else if .DebtorAgentBICFI -}}{{ regexReplaceAll "^[A-Z]{4}([A-Z]{2}).*" .DebtorAgentBICFI "$1" }}{{- else -}}UN{{- end -}}'

      - template:
          source: cred_cc
          template: '{{- if .CreditorAccountIdentificationIBAN -}}{{ regexReplaceAll "^(..).*" .CreditorAccountIdentificationIBAN "$1" }}{{- else if .CreditorAgentBICFI -}}{{ regexReplaceAll "^[A-Z]{4}([A-Z]{2}).*" .CreditorAgentBICFI "$1" }}{{- else -}}UN{{- end -}}'

      - template:
          source: route
          template: '{{.deb_cc}}->{{.cred_cc}}'

      # 6) Promote a SAFE subset of fields to labels.
      - labels:
          app:
          job:
          event_type:
          ServiceLevelCode:
          DebtorAgentBICFI:
          CreditorAgentBICFI:
          currency_norm:
          Status:
          CreditDebitIndicator:
          # --- New Country Code Labels ---
          deb_cc:
          cred_cc:
          route:

      # 7) Trim any accidental high-cardinality labels (defensive).
      - labeldrop:
          - __path__
