auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper          # keep for local/dev
      object_store: filesystem
      schema: v13
      index:
        prefix: loki_index_
        period: 24h

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/boltdb-cache

limits_config:
  query_timeout: 5m
  max_query_parallelism: 32
  max_entries_limit_per_query: 20000
  reject_old_samples: true
  reject_old_samples_max_age: 720h
  max_query_lookback: 720h
  max_query_length: 720h
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64
  volume_enabled: true               # needed for Grafana “Logs volume”
  allow_structured_metadata: false   # disable until TSDB is used
  per_stream_rate_limit: 100MB          # bytes/sec per stream
  per_stream_rate_limit_burst: 2000MB

pattern_ingester:
  enabled: true                      # optional; safe to keep enabled

query_range:
  cache_results: true

frontend:
  log_queries_longer_than: 10s
  compress_responses: true

chunk_store_config:
# removed: max_look_back_period (deprecated/removed)

ruler:
  alertmanager_url: http://localhost:9093
  enable_alertmanager_v2: true       # default true on newer Loki; explicit is fine
  enable_api: true
